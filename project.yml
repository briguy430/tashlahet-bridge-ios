name: TashlahetBridge
options:
  bundleIdPrefix: com.briguy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TashlahetBridge:
    type: application
    platform: iOS
    sources: [TashlahetBridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.briguy.tashlahetbridge
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tashlahet Bridge
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Translate the conversation you choose to record into English.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your translation server on the same Wi-Fi network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    info:
      path: TashlahetBridge/Info.plist
      properties:
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TashlahetBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TashlahetBridgeTests]
    dependencies:
      - target: TashlahetBridge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.briguy.tashlahetbridge.tests
schemes:
  TashlahetBridge:
    build:
      targets:
        TashlahetBridge: all
    test:
      targets: [TashlahetBridgeTests]
